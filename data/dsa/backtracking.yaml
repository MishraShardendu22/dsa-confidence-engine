- id: backtracking
  name: Backtracking
  description: Incrementally building candidates to solutions and abandoning (backtracking) a candidate as soon as it cannot lead to a valid solution.
  aliases:
    - backtracking
    - backtrack
    - explore paths
    - depth first search with rollback
  keywords:
    - backtrack
    - state
    - prune
    - rollback
  code_signals:
    - recursive_helper
    - append_pop_rollback
  explanation_examples:
    - "use backtracking to generate all permutations"
    - "try each possibility and backtrack when invalid"

- id: permutations_combinations
  name: Permutations and Combinations
  parent: backtracking
  description: Generating all permutations, combinations, or subsets.
  aliases:
    - permutations
    - combinations
    - subsets
    - power set
  keywords:
    - subset
    - permutation
    - combination

- id: n_queens
  name: Constraint Satisfaction (N-Queens / Sudoku)
  parent: backtracking
  description: Placing elements on a grid satisfying complex mutual constraints with pruning.
  aliases:
    - n queens
    - n-queens
    - constraint satisfaction
  keywords:
    - queens
    - board
    - constraint

- id: word_search_backtracking
  name: Grid Word Search Backtracking
  parent: backtracking
  description: Exploring 2D matrix paths for character sequences, marking cells visited temporarily and restoring state on backtrack.
  aliases:
    - word search
    - word search backtracking
    - grid backtracking
    - board dfs
  keywords:
    - word search
    - board
    - restore cell
    - 2d grid
  code_signals:
    - grid_cell_temp_mark_restore

- id: sudoku_solver
  name: Sudoku Solver (Exact Cover / Pruning)
  parent: backtracking
  description: Constraint satisfaction puzzle solver tracking row, column, and 3x3 block digit constraints.
  aliases:
    - sudoku solver
    - solve sudoku
    - 9x9 grid solver
  keywords:
    - sudoku
    - valid board
    - box constraint

- id: palindrome_partitioning
  name: Palindrome Partitioning
  parent: backtracking
  description: Partitioning a string such that every substring of the partition is a palindrome via recursive prefix expansion.
  aliases:
    - palindrome partitioning
    - partition palindromes
  keywords:
    - palindrome
    - partition
    - prefix substring

- id: combination_sum_backtracking
  name: Combination Sum (Target Accumulation)
  parent: backtracking
  description: Finding combinations of candidates that sum to a target value using sorted pruning and element re-use.
  aliases:
    - combination sum
    - combination sum ii
    - target sum backtracking
  keywords:
    - combination sum
    - target
    - remain
    - candidates
  code_signals:
    - combination_sum_path_pop

- id: subsets_power_set
  name: Subsets / Power Set Generation
  parent: backtracking
  description: Generating all subsets (the power set) of a collection using recursive choice trees or cascading iteration.
  aliases:
    - subsets
    - power set
    - generate power set
    - all subsets
  keywords:
    - subsets
    - power set
    - include exclude
  code_signals:
    - subset_backtrack_loop

