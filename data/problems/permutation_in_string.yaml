id: permutation_in_string
title: Permutation in String
description: "Given two strings s1 and s2, return true if s2 contains a permutation of s1, or false otherwise. In other words, return true if one of s1's permutations is the substring of s2."
language: python
entrypoint: solve
entrypoint_aliases:
  - checkInclusion
  - check_inclusion
starter_code: |
  def solve(s1, s2):
      # Write your solution here
      pass
tests:
  - id: "1"
    input: "{\"s1\": \"ab\", \"s2\": \"eidbaooo\"}"
    expected_output: "true"
  - id: "2"
    input: "{\"s1\": \"ab\", \"s2\": \"eidboaoo\"}"
    expected_output: "false"
  - id: "3"
    input: "{\"s1\": \"adc\", \"s2\": \"dcda\"}"
    expected_output: "true"
  - id: "4"
    input: "{\"s1\": \"a\", \"s2\": \"a\"}"
    expected_output: "true"
  - id: "5"
    input: "{\"s1\": \"ab\", \"s2\": \"ab\"}"
    expected_output: "true"
