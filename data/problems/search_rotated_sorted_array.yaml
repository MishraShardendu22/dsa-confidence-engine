id: search_rotated_sorted_array
title: Search in Rotated Sorted Array
description: "There is an integer array nums sorted in ascending order (with distinct values) which is possibly rotated at an unknown pivot index k. Given the array nums after the possible rotation and an integer target, return the index of target if it is in nums, or -1 if it is not in nums."
language: python
entrypoint: solve
entrypoint_aliases:
  - search
  - searchRotated
  - search_rotated
starter_code: |
  def solve(nums, target):
      # Write your solution here
      pass
tests:
  - id: "1"
    input: "{\"nums\": [4, 5, 6, 7, 0, 1, 2], \"target\": 0}"
    expected_output: "4"
  - id: "2"
    input: "{\"nums\": [4, 5, 6, 7, 0, 1, 2], \"target\": 3}"
    expected_output: "-1"
  - id: "3"
    input: "{\"nums\": [1], \"target\": 0}"
    expected_output: "-1"
  - id: "4"
    input: "{\"nums\": [3, 1], \"target\": 1}"
    expected_output: "1"
  - id: "5"
    input: "{\"nums\": [5, 1, 3], \"target\": 5}"
    expected_output: "0"
accepted_strategies:
  - binary_search_rotated
required_concepts:
  - binary_search
optional_concepts: []
primary_concepts:
