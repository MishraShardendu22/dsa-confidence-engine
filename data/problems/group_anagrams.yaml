id: group_anagrams
title: Group Anagrams
description: "Given an array of strings strs, group the anagrams together. You can return the answer in any order. An Anagram is a word or phrase formed by rearranging the letters of a different word or phrase, typically using all the original letters exactly once. Return sorted groups (each group sorted internally, and the list of groups sorted lexicographically by first element)."
language: python
entrypoint: solve
entrypoint_aliases:
  - groupAnagrams
  - group_anagrams
starter_code: |
  def solve(strs):
      # Write your solution here
      pass
tests:
  - id: "1"
    input: "{\"strs\": [\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"]}"
    expected_output: "[[\"ate\", \"eat\", \"tea\"], [\"bat\"], [\"nat\", \"tan\"]]"
  - id: "2"
    input: "{\"strs\": [\"\"]}"
    expected_output: "[[\"\"]]"
  - id: "3"
    input: "{\"strs\": [\"a\"]}"
    expected_output: "[[\"a\"]]"
  - id: "4"
    input: "{\"strs\": [\"abc\", \"bca\", \"cab\", \"xyz\"]}"
    expected_output: "[[\"abc\", \"bca\", \"cab\"], [\"xyz\"]]"
