id: pacific_atlantic_water_flow
title: Pacific Atlantic Water Flow
description: "There is an m x n rectangular island that borders both the Pacific Ocean and Atlantic Ocean. The Pacific Ocean touches the island's left and top edges, and the Atlantic Ocean touches the island's right and bottom edges. Water can flow to neighboring cells (north, south, east, west) if the neighboring cell's height is less than or equal to the current cell's height. Given an m x n integer matrix heights where heights[r][c] represents the height above sea level of the cell at coordinate (r, c), return a 2D list of grid coordinates result where result[i] = [ri, ci] denotes that rain water can flow from cell (ri, ci) to both the Pacific and Atlantic oceans."
language: python
entrypoint: solve
entrypoint_aliases:
  - pacificAtlantic
  - pacific_atlantic
starter_code: |
  def solve(heights):
      # Return sorted list of [r,c] pairs
      pass
tests:
  - id: "1"
    input: "{\"heights\": [[1,2,2,3,5],[3,2,3,4,4],[2,4,5,3,1],[6,7,1,4,5],[5,1,1,2,4]]}"
    expected_output: "[[0, 4], [1, 3], [1, 4], [2, 2], [3, 0], [3, 1], [4, 0]]"
  - id: "2"
    input: "{\"heights\": [[1]]}"
    expected_output: "[[0, 0]]"
  - id: "3"
    input: "{\"heights\": [[1, 1], [1, 1]]}"
    expected_output: "[[0, 0], [0, 1], [1, 0], [1, 1]]"
accepted_strategies:
