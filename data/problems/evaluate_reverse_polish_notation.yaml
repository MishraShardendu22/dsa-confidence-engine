id: evaluate_reverse_polish_notation
title: Evaluate Reverse Polish Notation
description: "You are given an array of strings tokens that represents an arithmetic expression in a Reverse Polish Notation. Evaluate the expression. Return an integer that represents the value of the expression. Note that: The valid operators are '+', '-', '*', and '/'. Each operand may be an integer or another expression. The division between two integers always truncates toward zero."
language: python
entrypoint: solve
entrypoint_aliases:
  - evalRPN
  - eval_rpn
starter_code: |
  def solve(tokens):
      # Write your solution here
      pass
tests:
  - id: "1"
    input: "{\"tokens\": [\"2\", \"1\", \"+\", \"3\", \"*\"]}"
    expected_output: "9"
  - id: "2"
    input: "{\"tokens\": [\"4\", \"13\", \"5\", \"/\", \"+\"]}"
    expected_output: "6"
  - id: "3"
    input: "{\"tokens\": [\"10\", \"6\", \"9\", \"3\", \"+\", \"-11\", \"*\", \"/\", \"*\", \"17\", \"+\", \"5\", \"+\"]}"
    expected_output: "22"
  - id: "4"
    input: "{\"tokens\": [\"3\"]}"
    expected_output: "3"
accepted_strategies:
