id: combination_sum
title: Combination Sum
description: "Given an array of distinct integers candidates and a target integer target, return a list of all unique combinations of candidates where the chosen numbers sum to target. You may return the combinations in any order. The same number may be chosen from candidates an unlimited number of times. Two combinations are unique if the frequency of at least one of the chosen numbers is different. Sort each combination and sort the list of combinations."
language: python
entrypoint: solve
entrypoint_aliases:
  - combinationSum
  - combination_sum
starter_code: |
  def solve(candidates, target):
      # Write your solution here
      pass
tests:
  - id: "1"
    input: "{\"candidates\": [2, 3, 6, 7], \"target\": 7}"
    expected_output: "[[2, 2, 3], [7]]"
  - id: "2"
    input: "{\"candidates\": [2, 3, 5], \"target\": 8}"
    expected_output: "[[2, 2, 2, 2], [2, 3, 3], [3, 5]]"
  - id: "3"
    input: "{\"candidates\": [2], \"target\": 1}"
    expected_output: "[]"
  - id: "4"
    input: "{\"candidates\": [1], \"target\": 1}"
    expected_output: "[[1]]"
accepted_strategies:
