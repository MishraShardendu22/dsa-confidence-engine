    input: "{\"intervals\": [[1, 3], [2, 6], [8, 10], [15, 18]]}"
    expected_output: "[[1, 6], [8, 10], [15, 18]]"
  - id: "2"
    input: "{\"intervals\": [[1, 4], [4, 5]]}"
    expected_output: "[[1, 5]]"
  - id: "3"
    input: "{\"intervals\": [[1, 4]]}"
    expected_output: "[[1, 4]]"
  - id: "4"
    input: "{\"intervals\": [[1, 4], [0, 4]]}"
    expected_output: "[[0, 4]]"
  - id: "5"
    input: "{\"intervals\": [[1, 4], [2, 3]]}"
    expected_output: "[[1, 4]]"
