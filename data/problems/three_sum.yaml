id: three_sum
title: 3Sum
description: "Given an integer array nums, return all the triplets [nums[i], nums[j], nums[k]] such that i != j, i != k, and j != k, and nums[i] + nums[j] + nums[k] == 0. Notice that the solution set must not contain duplicate triplets. Return sorted triplets."
language: python
entrypoint: solve
entrypoint_aliases:
  - threeSum
  - three_sum
starter_code: |
  def solve(nums):
      # Write your solution here
      pass
tests:
  - id: "1"
    input: "{\"nums\": [-1, 0, 1, 2, -1, -4]}"
    expected_output: "[[-1, -1, 2], [-1, 0, 1]]"
  - id: "2"
    input: "{\"nums\": [0, 1, 1]}"
    expected_output: "[]"
  - id: "3"
    input: "{\"nums\": [0, 0, 0]}"
    expected_output: "[[0, 0, 0]]"
  - id: "4"
    input: "{\"nums\": [-2, 0, 0, 2, 2]}"
    expected_output: "[[-2, 0, 2]]"
  - id: "5"
    input: "{\"nums\": [3, 0, -2, -1, 1, 2]}"
    expected_output: "[[-2, -1, 3], [-2, 0, 2], [-1, 0, 1]]"
