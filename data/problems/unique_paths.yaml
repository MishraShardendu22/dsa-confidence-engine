    input: "{\"m\": 3, \"n\": 7}"
    expected_output: "28"
  - id: "2"
    input: "{\"m\": 3, \"n\": 2}"
    expected_output: "3"
  - id: "3"
    input: "{\"m\": 1, \"n\": 1}"
    expected_output: "1"
  - id: "4"
    input: "{\"m\": 7, \"n\": 3}"
    expected_output: "28"
  - id: "5"
    input: "{\"m\": 2, \"n\": 2}"
    expected_output: "2"
